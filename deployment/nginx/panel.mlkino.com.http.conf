# New site only; install after explicit approval. Do not replace the existing API site.
server {
    listen 80;
    listen [::]:80;
    server_name panel.mlkino.com;
    root /var/www/mlkino-frontend/current;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mlkino-frontend/shared/acme;
        try_files $uri =404;
    }
    location / { return 301 https://panel.mlkino.com$request_uri; }
}
