# Include at http scope. Only gateway-generated errors use these headers;
# ordinary API responses are owned by django-cors-headers.
map $http_origin $mlkino_error_origin {
    default "";
    "https://mlkino.com" "https://mlkino.com";
    "http://localhost:3000" "http://localhost:3000";
    "http://127.0.0.1:3000" "http://127.0.0.1:3000";
}
map $mlkino_error_origin $mlkino_error_credentials {
    "" "";
    default "true";
}
