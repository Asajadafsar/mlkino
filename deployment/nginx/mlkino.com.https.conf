server {
    listen 80;
    listen [::]:80;
    server_name mlkino.com www.mlkino.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://mlkino.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mlkino.com;
    ssl_certificate /etc/letsencrypt/live/mlkino.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mlkino.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://mlkino.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mlkino.com;
    ssl_certificate /etc/letsencrypt/live/mlkino.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mlkino.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://panel.mlkino.com; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    client_max_body_size 2m;
    location ~ /\. { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
