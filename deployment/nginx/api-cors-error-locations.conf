# Include inside each HTTPS server. Upstream application errors retain Django headers.
proxy_intercept_errors off;

error_page 413 = @mlkino_error_413;
location @mlkino_error_413 {
    default_type application/json;
    add_header Access-Control-Allow-Origin $mlkino_error_origin always;
    add_header Access-Control-Allow-Credentials $mlkino_error_credentials always;
    add_header Vary Origin always;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    return 413 '{"message":"Gateway request failed","status":413}';
}

