name: MLKino production

on:
  push:
    branches: [codex/latest]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.repository == 'Asajadafsar/mlkino' && github.ref == 'refs/heads/codex/latest'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Test Django
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python manage.py makemigrations --check --dry-run --settings=mlkino.test_settings
          python manage.py test --settings=mlkino.test_settings
          python -m unittest discover -s deployment/ci -p 'test_*.py'
      - name: Test React panel
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm test -- --watchAll=false --runInBand
      - name: Build React panel
        working-directory: frontend
        env:
          PUBLIC_URL: /panel
          REACT_APP_API_URL: https://mlkino.com
          REACT_APP_WS_URL: wss://mlkino.com
          GENERATE_SOURCEMAP: 'false'
          # The production webpack build reports existing lint warnings.
          CI: 'false'
        run: npm run build
      - name: Build and type-check Next.js
        working-directory: landing
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_URL: https://mlkino.com
          NEXT_PUBLIC_PANEL_URL: https://mlkino.com/panel
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Package tracked backend and built frontends
        run: |
          python deployment/ci/package.py "$GITHUB_SHA" "$RUNNER_TEMP/mlkino-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mlkino-${{ github.sha }}
          path: ${{ runner.temp }}/mlkino-release
          if-no-files-found: error
          retention-days: 5

  production:
    needs: build
    if: github.repository == 'Asajadafsar/mlkino' && github.ref == 'refs/heads/codex/latest'
    environment:
      name: production
      url: https://mlkino.com
    concurrency:
      group: mlkino-production
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, mlkino-production]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mlkino-${{ github.sha }}
          path: ${{ runner.temp }}/mlkino-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify branch tip, apply release, and confirm production health
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/mlkino-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_PROTECTED,,}" = true
          latest=$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/Asajadafsar/mlkino/git/ref/heads/codex/latest' |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')
          unset GH_TOKEN
          test "$latest" = "$GITHUB_SHA"
          sha256sum -c SHA256SUMS
          test "$(tar -xOzf release.tar.gz RELEASE)" = "$GITHUB_SHA"
          sudo -n /usr/local/libexec/mlkino-deploy < release.tar.gz
          printf '### Production verified for `%s`\n\n- https://mlkino.com/\n- https://mlkino.com/panel/\n- https://mlkino.com/api/panel/public/catalog/\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove downloaded release
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/mlkino-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
