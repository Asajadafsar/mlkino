# Applied inside the existing mlkino.com HTTPS server block.
# Repeat security headers because location add_header overrides inheritance.
    location = /panel {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        return 302 /panel/;
    }

    # Only content-hashed bundles may be retained across panel releases.
    location ^~ /panel/static/ {
        alias /opt/mlkino/current/frontend/build/static/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location ^~ /panel/ {
        alias /opt/mlkino/current/frontend/build/;
        expires off;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /panel/index.html;
    }

