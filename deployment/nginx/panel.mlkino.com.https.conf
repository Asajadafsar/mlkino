# Enable only AFTER panel.mlkino.com certificate exists. API certificate is not valid for panel.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name panel.mlkino.com;
    ssl_certificate /etc/letsencrypt/live/panel.mlkino.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.mlkino.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    root /var/www/mlkino-frontend/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /index.html { add_header Cache-Control "no-store" always; }
    location = /asset-manifest.json { add_header Cache-Control "no-cache" always; }
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ { try_files $uri =404; expires 1h; }
    location ~* \.(?:woff2?|ttf|png|jpe?g|webp|svg|ico|css|js)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
